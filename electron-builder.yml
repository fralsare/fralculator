appId: com.fralsare.fralculator
productName: Fralculator
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-Portable-${version}.exe
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  maintainDependencies: true
npmRebuild: false
