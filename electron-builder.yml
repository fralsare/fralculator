appId: com.fralsare.fralculator
productName: Fralculator
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-Portable-${version}.exe
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
npmRebuild: false
# Releases are created by the publish job (softprops/action-gh-release);
# stop electron-builder from trying to publish on its own when a tag is set.
publish: null
