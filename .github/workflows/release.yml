name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # v4.1.0 -> current v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (NSIS + portable)
        run: npx electron-builder --win --x64
      # v4 (current tag)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win
          path: |
            release/*.exe
            release/*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # v4.1.0 -> current v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (AppImage + deb + rpm)
        run: npx electron-builder --linux AppImage deb rpm
      # v4 (current tag)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # v4 (current tag)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Create GitHub Release
        # pinned tag (v2 line is stable, latest minor 2.3.2)
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            artifacts/win/*.exe
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
