name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # v4.1.0
      - uses: actions/setup-node@48b55e008b3f8f8d396c67292636d31e824f771f
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (NSIS + portable)
        run: npx electron-builder --win --x64
      # v4.6.0
      - uses: actions/upload-artifact@0b2256b1c953bed7c007b222357d72f9c92e4cd7
        with:
          name: win
          path: |
            release/*.exe
            release/*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # v4.1.0
      - uses: actions/setup-node@48b55e008b3f8f8d396c67292636d31e824f771f
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (AppImage + deb + rpm)
        run: npx electron-builder --linux AppImage deb rpm
      # v4.6.0
      - uses: actions/upload-artifact@0b2256b1c953bed7c007b222357d72f9c92e4cd7
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # v4.3.0
      - uses: actions/download-artifact@fa0a91b353c890e031203b6c54fe20f0bb901940
        with:
          path: artifacts
      - name: Create GitHub Release
        # pinned tag (v2 line is stable, latest minor 2.3.2)
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            artifacts/win/*.exe
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
